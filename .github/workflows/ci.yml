name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync the environment
        run: uv sync --all-groups

      # the notebook is deliberately left out: ruff flags the trailing
      # `return` closing every marimo cell, which is marimo's file format
      - name: Lint
        run: uv run ruff check tetris tests

      - name: Test
        run: uv run pytest --cov=tetris --cov-report=term-missing --cov-fail-under=95
